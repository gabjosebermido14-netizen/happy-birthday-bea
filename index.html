<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Bea!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Georgia', serif;
      background-color: #0d0d0d;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
      color: #fff;
    }

    /* Realistic 3D Gift Box */
    .gift-container {
      position: relative;
      z-index: 10;
      cursor: pointer;
      perspective: 1000px;
      transition: opacity 0.8s ease, transform 0.3s ease;
    }
    .gift-container:hover {
      transform: scale(1.05);
    }
    .realistic-box {
      width: 150px;
      height: 150px;
      position: relative;
      background: linear-gradient(135deg, #d32f2f, #8b0000);
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8), inset 0 2px 5px rgba(255,255,255,0.4);
    }
    .realistic-box::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 30px;
      height: 100%;
      background: linear-gradient(to right, #ffe066, #ffd700, #b8860b);
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }
    .realistic-box::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      width: 100%;
      height: 30px;
      background: linear-gradient(to bottom, #ffe066, #ffd700, #b8860b);
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }
    .bow {
      position: absolute;
      top: -25px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 30px;
      z-index: 2;
    }
    .bow::before, .bow::after {
      content: '';
      position: absolute;
      width: 30px;
      height: 30px;
      border-radius: 50% 50% 0 50%;
      background: linear-gradient(135deg, #ffd700, #b8860b);
      box-shadow: 0 5px 10px rgba(0,0,0,0.4);
    }
    .bow::before {
      left: 0;
      transform: rotate(45deg);
    }
    .bow::after {
      right: 0;
      transform: rotate(-45deg) scaleX(-1);
    }

    /* Greeting Overlay */
    .greeting-overlay {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      opacity: 0;
      z-index: 15;
      pointer-events: none;
      transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .greeting-overlay.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
    .cake-icon {
      font-size: 5rem;
      margin-bottom: 10px;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
    }
    .greeting-text {
      font-size: 2.5rem;
      color: #ff4d6d;
      font-weight: bold;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
    }

    /* Final Popup Card */
    .popup-modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.7);
      background: rgba(20, 20, 20, 0.92);
      padding: 30px 25px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.8);
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      max-width: 320px;
      width: 90%;
      border: 1px solid #ff4d6d;
    }
    .popup-modal.show {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }
    .popup-message {
      font-size: 1.2rem;
      color: #f1f1f1;
      margin-bottom: 15px;
      line-height: 1.5;
    }
    .popup-author {
      font-size: 0.95rem;
      color: #ff4d6d;
      font-weight: bold;
      font-style: italic;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
    }
    #confettiCanvas { z-index: 12; }
    #roseCanvas { z-index: 20; }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <audio id="bgMusic" src="style.mp3" preload="auto"></audio>

  <div class="gift-container" id="giftCard" onclick="handleGiftClick()">
    <div class="realistic-box">
      <div class="bow"></div>
    </div>
  </div>

  <div class="greeting-overlay" id="greetingOverlay">
    <div class="cake-icon">🎂</div>
    <div class="greeting-text">Happy Birthday, Bea! 🎉</div>
  </div>

  <div class="popup-modal" id="popupModal">
    <p class="popup-message">I wish you appreciate it! ✨</p>
    <p class="popup-author">Created by your ITnorante Gab tsaaahahaha 😄</p>
  </div>

  <canvas id="confettiCanvas"></canvas>
  <canvas id="roseCanvas"></canvas>

  <script>
    const confettiCanvas = document.getElementById('confettiCanvas');
    const roseCanvas = document.getElementById('roseCanvas');
    const confCtx = confettiCanvas.getContext('2d');
    const roseCtx = roseCanvas.getContext('2d');

    const giftCard = document.getElementById('giftCard');
    const greetingOverlay = document.getElementById('greetingOverlay');
    const popupModal = document.getElementById('popupModal');
    const bgMusic = document.getElementById('bgMusic');

    function resizeCanvases() {
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;
      roseCanvas.width = window.innerWidth;
      roseCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvases);
    resizeCanvases();

    let confettiParticles = [];
    let roses = [];
    let softRoses = []; // Para sa huling bahagi
    let isFallingStarted = false;

    // Load Local Rose Image
    const roseImg = new Image();
    roseImg.src = 'rose.png';

    // Confetti Effect
    class Confetti {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.size = Math.random() * 6 + 4;
        this.color = ['#ff4d6d', '#ffd700', '#ff758f', '#ffffff'][Math.floor(Math.random() * 4)];
        this.vx = (Math.random() - 0.5) * 12;
        this.vy = (Math.random() - 0.7) * 12;
        this.gravity = 0.25;
        this.opacity = 1;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 0.2;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += this.gravity;
        this.opacity -= 0.01;
        this.rotation += this.rotSpeed;
      }
      draw() {
        if (this.opacity <= 0) return;
        confCtx.save();
        confCtx.translate(this.x, this.y);
        confCtx.rotate(this.rotation);
        confCtx.globalAlpha = this.opacity;
        confCtx.fillStyle = this.color;
        confCtx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
        confCtx.restore();
      }
    }

    function triggerConfetti() {
      const centerX = confettiCanvas.width / 2;
      const centerY = confettiCanvas.height / 2;
      for (let i = 0; i < 60; i++) {
        confettiParticles.push(new Confetti(centerX, centerY));
      }
    }

    // First Part: Falling Radial Bloom Roses
    class RealisticRose {
      constructor(centerX, centerY, radius, angle) {
        this.centerX = centerX;
        this.centerY = centerY;
        this.targetRadius = radius;
        this.angle = angle;
        this.currentScale = 0;
        this.maxScale = Math.random() * 0.04 + 0.18; 
        this.growthRate = 0.01;
        this.opacity = 1;

        this.x = this.centerX + Math.cos(this.angle) * this.targetRadius;
        this.y = this.centerY + Math.sin(this.angle) * this.targetRadius;

        this.vy = 0;
        this.vx = (Math.random() - 0.5) * 1.2;
        this.gravity = Math.random() * 0.12 + 0.08;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 0.02;
      }

      update() {
        if (!isFallingStarted) {
          if (this.currentScale < this.maxScale) {
            this.currentScale += this.growthRate;
          }
        } else {
          this.y += this.vy;
          this.x += this.vx;
          this.vy += this.gravity;
          this.rotation += this.rotSpeed;

          if (this.y > roseCanvas.height - 100) {
            this.opacity -= 0.02;
          }
        }
      }

      draw() {
        if (this.opacity <= 0) return;

        roseCtx.save();
        roseCtx.translate(this.x, this.y);
        roseCtx.rotate(this.rotation);
        roseCtx.globalAlpha = Math.max(0, this.opacity);

        if (roseImg.complete && roseImg.naturalWidth !== 0) {
          const w = roseImg.width * this.currentScale;
          const h = roseImg.height * this.currentScale;
          roseCtx.drawImage(roseImg, -w / 2, -h / 2, w, h);
        }

        roseCtx.restore();
      }
    }

    // Last Part: Soft Spread Soft Appearing and Disappearing Roses
    class SoftSpreadRose {
      constructor() {
        this.x = Math.random() * (roseCanvas.width - 60) + 30;
        this.y = Math.random() * (roseCanvas.height - 60) + 30;
        this.scale = Math.random() * 0.04 + 0.18;
        this.rotation = Math.random() * Math.PI * 2;
        this.opacity = 0;
        this.state = 'fade-in'; // 'fade-in', 'hold', 'fade-out'
      }

      update() {
        if (this.state === 'fade-in') {
          this.opacity += 0.02;
          if (this.opacity >= 0.85) {
            this.opacity = 0.85;
            this.state = 'hold';
          }
        } else if (this.state === 'fade-out') {
          this.opacity -= 0.02;
          if (this.opacity <= 0) {
            this.opacity = 0;
          }
        }
      }

      draw() {
        if (this.opacity <= 0) return;

        roseCtx.save();
        roseCtx.translate(this.x, this.y);
        roseCtx.rotate(this.rotation);
        roseCtx.globalAlpha = Math.max(0, this.opacity);

        if (roseImg.complete && roseImg.naturalWidth !== 0) {
          const w = roseImg.width * this.scale;
          const h = roseImg.height * this.scale;
          roseCtx.drawImage(roseImg, -w / 2, -h / 2, w, h);
        }

        roseCtx.restore();
      }
    }

    function handleGiftClick() {
      if (bgMusic) {
        bgMusic.play().catch(err => console.log("Play failed:", err));
      }

      giftCard.style.opacity = '0';
      setTimeout(() => giftCard.classList.add('hidden'), 800);

      triggerConfetti();
      greetingOverlay.classList.add('show');

      // DELAY 1: 6 Seconds
      setTimeout(() => {
        greetingOverlay.classList.remove('show');
        startRoseBloom();
      }, 6000);
    }

    function startRoseBloom() {
      const centerX = roseCanvas.width / 2;
      const centerY = roseCanvas.height / 2;
      const maxDistance = Math.hypot(centerX, centerY) + 80;

      let currentRadius = 50;
      let angleOffset = 0;

      const ringInterval = setInterval(() => {
        const countInRing = 8; 
        const angleStep = (Math.PI * 2) / countInRing;

        for (let i = 0; i < countInRing; i++) {
          const angle = i * angleStep + angleOffset;
          roses.push(new RealisticRose(centerX, centerY, currentRadius, angle));
        }

        currentRadius += 100;
        angleOffset += 0.4;

        if (currentRadius > maxDistance) {
          clearInterval(ringInterval);

          // DELAY 2: 6 Seconds Bago Mahulog ang Rosas at Lumabas ang Message
          setTimeout(() => {
            isFallingStarted = true;
            popupModal.classList.add('show');

            // Simulan ang Soft Spread Rose Effect sa Huling Bahagi
            setTimeout(startSoftSpreadBackground, 1500);
          }, 6000);
        }
      }, 250);
    }

    // Function para sa Huling Bahagi (Soft Spread + Soft Fade In/Out Every 4 Seconds)
    function startSoftSpreadBackground() {
      function spawnSpreadRoses() {
        softRoses = [];
        // Gagawa ng 20 nakakalat na rosas sa canvas
        for (let i = 0; i < 20; i++) {
          softRoses.push(new SoftSpreadRose());
        }

        // Pagkalipas ng 2 seconds, magsi-simula silang mag-fade out
        setTimeout(() => {
          softRoses.forEach(rose => rose.state = 'fade-out');
        }, 2000);
      }

      spawnSpreadRoses();
      // Paulit-ulit tuwing 4 seconds
      setInterval(spawnSpreadRoses, 4000);
    }

    function animate() {
      confCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      roseCtx.clearRect(0, 0, roseCanvas.width, roseCanvas.height);

      confettiParticles.forEach((p, index) => {
        p.update();
        p.draw();
        if (p.opacity <= 0) confettiParticles.splice(index, 1);
      });

      // Render 1st Part Roses
      roses.forEach((rose, index) => {
        rose.update();
        rose.draw();
        if (rose.opacity <= 0 || rose.y > roseCanvas.height + 100) {
          roses.splice(index, 1);
        }
      });

      // Render Last Part Soft Spread Roses
      softRoses.forEach(rose => {
        rose.update();
        rose.draw();
      });

      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
