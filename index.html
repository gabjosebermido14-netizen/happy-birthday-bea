<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Happy Birthday Bea!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d0d0d;
      font-family: 'Georgia', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #fff;
    }

    /* Realistic 3D Gift Box */
    .gift-container {
      position: relative;
      z-index: 10;
      cursor: pointer;
      perspective: 1000px;
      transition: opacity 0.8s ease, transform 0.3s ease;
      touch-action: manipulation;
    }
    .gift-container:hover {
      transform: scale(1.05);
    }
    .realistic-box {
      width: clamp(120px, 30vw, 160px);
      height: clamp(120px, 30vw, 160px);
      position: relative;
      background: linear-gradient(135deg, #d32f2f, #8b0000);
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8), inset 0 2px 5px rgba(255,255,255,0.4);
    }
    .realistic-box::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 20%;
      height: 100%;
      background: linear-gradient(to right, #ffe066, #ffd700, #b8860b);
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }
    .realistic-box::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      width: 100%;
      height: 20%;
      background: linear-gradient(to bottom, #ffe066, #ffd700, #b8860b);
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }
    .bow {
      position: absolute;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 40%;
      height: 20%;
      z-index: 2;
    }
    .bow::before, .bow::after {
      content: '';
      position: absolute;
      width: 50%;
      height: 100%;
      border-radius: 50% 50% 0 50%;
      background: linear-gradient(135deg, #ffd700, #b8860b);
      box-shadow: 0 5px 10px rgba(0,0,0,0.4);
    }
    .bow::before {
      left: 0;
      transform: rotate(45deg);
    }
    .bow::after {
      right: 0;
      transform: rotate(-45deg) scaleX(-1);
    }

    /* Greeting Overlay */
    .greeting-overlay {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      opacity: 0;
      z-index: 15;
      pointer-events: none;
      transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 90%;
    }
    .greeting-overlay.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    /* REALISTIC 3D CSS CAKE */
    .realistic-cake {
      position: relative;
      width: clamp(100px, 22vw, 140px);
      height: clamp(80px, 18vw, 110px);
      margin-bottom: 25px;
      perspective: 500px;
    }
    .cake-base {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 60%;
      background: linear-gradient(to right, #4a2c20, #7a4a35, #361f16);
      border-radius: 10px 10px 15px 15px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.8), inset 0 -5px 10px rgba(0,0,0,0.5);
    }
    .cake-icing {
      position: absolute;
      top: 25%;
      width: 104%;
      left: -2%;
      height: 30%;
      background: linear-gradient(to bottom, #fff0f3, #ffb3c1);
      border-radius: 12px 12px 8px 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }
    .cake-icing::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 0;
      width: 100%;
      height: 10px;
      background: radial-gradient(circle, #ffb3c1 60%, transparent 70%);
      background-size: 15px 15px;
    }
    .candle {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 10px;
      height: 30px;
      background: repeating-linear-gradient(45deg, #fff, #fff 5px, #ff4d6d 5px, #ff4d6d 10px);
      border-radius: 3px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.4);
    }
    .flame {
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      width: 12px;
      height: 18px;
      background: radial-gradient(ellipse at bottom, #ffea00 0%, #ff6d00 60%, transparent 100%);
      border-radius: 50% 50% 20% 20%;
      box-shadow: 0 0 15px #ffea00, 0 0 25px #ff6d00;
      animation: flicker 0.1s infinite alternate;
    }
    @keyframes flicker {
      0% { transform: translateX(-50%) scale(1) rotate(-2deg); opacity: 0.95; }
      100% { transform: translateX(-50%) scale(1.1) rotate(2deg); opacity: 1; }
    }

    .greeting-text {
      font-size: clamp(1.8rem, 6vw, 3.2rem);
      color: #ff4d6d;
      font-weight: bold;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
    }

    /* Final Popup Card */
    .popup-modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.7);
      background: rgba(20, 20, 20, 0.94);
      padding: clamp(20px, 5vw, 35px);
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.8);
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      width: min(90%, 400px);
      border: 1px solid #ff4d6d;
    }
    .popup-modal.show {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }
    .popup-message {
      font-size: clamp(1rem, 3.5vw, 1.25rem);
      color: #f1f1f1;
      margin-bottom: 8px;
      line-height: 1.5;
    }
    .popup-submessage {
      font-size: clamp(0.95rem, 3.2vw, 1.15rem);
      color: #ffd700;
      margin-bottom: 15px;
      line-height: 1.4;
      font-weight: 500;
    }
    .popup-author {
      font-size: clamp(0.85rem, 3vw, 1rem);
      color: #ff4d6d;
      font-weight: bold;
      font-style: italic;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
    }
    #confettiCanvas { z-index: 12; }
    #roseCanvas { z-index: 20; }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <audio id="bgMusic" src="https://files.catbox.moe/8y3x2x.mp3" preload="auto" playsinline></audio>

  <div class="gift-container" id="giftCard">
    <div class="realistic-box">
      <div class="bow"></div>
    </div>
  </div>

  <div class="greeting-overlay" id="greetingOverlay">
    <div class="realistic-cake">
      <div class="candle">
        <div class="flame"></div>
      </div>
      <div class="cake-icing"></div>
      <div class="cake-base"></div>
    </div>
    <div class="greeting-text">Happy Birthday, Bea! </div>
  </div>

  <div class="popup-modal" id="popupModal">
    <p class="popup-message">I wish you appreciate it!</p>
    <p class="popup-submessage">Wishing you many more years to come! </p>
    <p class="popup-author">From your ITnorante Gab tsaaahahaha </p>
  </div>

  <canvas id="confettiCanvas"></canvas>
  <canvas id="roseCanvas"></canvas>

  <script>
    const confettiCanvas = document.getElementById('confettiCanvas');
    const roseCanvas = document.getElementById('roseCanvas');
    const confCtx = confettiCanvas.getContext('2d');
    const roseCtx = roseCanvas.getContext('2d');

    const giftCard = document.getElementById('giftCard');
    const greetingOverlay = document.getElementById('greetingOverlay');
    const popupModal = document.getElementById('popupModal');
    const bgMusic = document.getElementById('bgMusic');

    function resizeCanvases() {
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;
      roseCanvas.width = window.innerWidth;
      roseCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvases);
    resizeCanvases();

    let confettiParticles = [];
    let roses = [];
    let softRoses = [];
    let isFallingStarted = false;
    let isClicked = false;

    // Load Local Rose Image
    const roseImg = new Image();
    roseImg.src = 'rose.png';

    // Confetti Effect
    class Confetti {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.size = Math.random() * 6 + 4;
        this.color = ['#ff4d6d', '#ffd700', '#ff758f', '#ffffff'][Math.floor(Math.random() * 4)];
        this.vx = (Math.random() - 0.5) * 12;
        this.vy = (Math.random() - 0.7) * 12;
        this.gravity = 0.25;
        this.opacity = 1;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 0.2;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += this.gravity;
        this.opacity -= 0.01;
        this.rotation += this.rotSpeed;
      }
      draw() {
        if (this.opacity <= 0) return;
        confCtx.save();
        confCtx.translate(this.x, this.y);
        confCtx.rotate(this.rotation);
        confCtx.globalAlpha = this.opacity;
        confCtx.fillStyle = this.color;
        confCtx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
        confCtx.restore();
      }
    }

    function triggerConfetti() {
      const centerX = confettiCanvas.width / 2;
      const centerY = confettiCanvas.height / 2;
      for (let i = 0; i < 60; i++) {
        confettiParticles.push(new Confetti(centerX, centerY));
      }
    }

    // First Part: Falling Radial Bloom Roses
    class RealisticRose {
      constructor(centerX, centerY, radius, angle) {
        this.centerX = centerX;
        this.centerY = centerY;
        this.targetRadius = radius;
        this.angle = angle;
        this.currentScale = 0;
        
        const baseScale = window.innerWidth < 600 ? 0.14 : 0.18;
        this.maxScale = Math.random() * 0.03 + baseScale; 
        this.growthRate = 0.01;
        this.opacity = 1;

        this.x = this.centerX + Math.cos(this.angle) * this.targetRadius;
        this.y = this.centerY + Math.sin(this.angle) * this.targetRadius;

        this.vy = 0;
        this.vx = (Math.random() - 0.5) * 1.2;
        this.gravity = Math.random() * 0.12 + 0.08;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 0.02;
      }

      update() {
        if (!isFallingStarted) {
          if (this.currentScale < this.maxScale) {
            this.currentScale += this.growthRate;
          }
        } else {
          this.y += this.vy;
          this.x += this.vx;
          this.vy += this.gravity;
          this.rotation += this.rotSpeed;

          if (this.y > roseCanvas.height - 100) {
            this.opacity -= 0.02;
          }
        }
      }

      draw() {
        if (this.opacity <= 0) return;

        roseCtx.save();
        roseCtx.translate(this.x, this.y);
        roseCtx.rotate(this.rotation);
        roseCtx.globalAlpha = Math.max(0, this.opacity);

        if (roseImg.complete && roseImg.naturalWidth !== 0) {
          const w = roseImg.width * this.currentScale;
          const h = roseImg.height * this.currentScale;
          roseCtx.drawImage(roseImg, -w / 2, -h / 2, w, h);
        }

        roseCtx.restore();
      }
    }

    // Last Part: Soft Spread Roses
    class SoftSpreadRose {
      constructor() {
        this.x = Math.random() * (roseCanvas.width - 60) + 30;
        this.y = Math.random() * (roseCanvas.height - 60) + 30;
        const baseScale = window.innerWidth < 600 ? 0.14 : 0.18;
        this.scale = Math.random() * 0.03 + baseScale;
        this.rotation = Math.random() * Math.PI * 2;
        this.opacity = 0;
        this.state = 'fade-in';
      }

      update() {
        if (this.state === 'fade-in') {
          this.opacity += 0.02;
          if (this.opacity >= 0.85) {
            this.opacity = 0.85;
            this.state = 'hold';
          }
        } else if (this.state === 'fade-out') {
          this.opacity -= 0.02;
          if (this.opacity <= 0) {
            this.opacity = 0;
          }
        }
      }

      draw() {
        if (this.opacity <= 0) return;

        roseCtx.save();
        roseCtx.translate(this.x, this.y);
        roseCtx.rotate(this.rotation);
        roseCtx.globalAlpha = Math.max(0, this.opacity);

        if (roseImg.complete && roseImg.naturalWidth !== 0) {
          const w = roseImg.width * this.scale;
          const h = roseImg.height * this.scale;
          roseCtx.drawImage(roseImg, -w / 2, -h / 2, w, h);
        }

        roseCtx.restore();
      }
    }

    // Helper function to safely play music on mobile browsers
    function playAudioForMobile() {
      if (bgMusic) {
        bgMusic.volume = 1.0;
        bgMusic.currentTime = 0;
        
        const promise = bgMusic.play();
        if (promise !== undefined) {
          promise.then(() => {
            console.log("Audio started successfully!");
          }).catch(error => {
            console.log("Audio playback deferred or failed: ", error);
          });
        }
      }
    }

    function handleGiftClick(e) {
      if (isClicked) return;
      isClicked = true;

      // Play audio directly upon touch/click gesture
      playAudioForMobile();

      giftCard.style.opacity = '0';
      setTimeout(() => giftCard.classList.add('hidden'), 800);

      triggerConfetti();
      greetingOverlay.classList.add('show');

      // DELAY 1: 6 Seconds
      setTimeout(() => {
        greetingOverlay.classList.remove('show');
        startRoseBloom();
      }, 6000);
    }

    // Pointerdown trigger works universally for touchscreens and desktop clicks
    giftCard.addEventListener('pointerdown', handleGiftClick);

    function startRoseBloom() {
      const centerX = roseCanvas.width / 2;
      const centerY = roseCanvas.height / 2;
      const maxDistance = Math.hypot(centerX, centerY) + 80;

      let currentRadius = 40;
      let angleOffset = 0;

      const ringInterval = setInterval(() => {
        const countInRing = 8; 
        const angleStep = (Math.PI * 2) / countInRing;

        for (let i = 0; i < countInRing; i++) {
          const angle = i * angleStep + angleOffset;
          roses.push(new RealisticRose(centerX, centerY, currentRadius, angle));
        }

        currentRadius += window.innerWidth < 600 ? 70 : 100;
        angleOffset += 0.4;

        if (currentRadius > maxDistance) {
          clearInterval(ringInterval);

          // DELAY 2: 6 Seconds
          setTimeout(() => {
            isFallingStarted = true;
            popupModal.classList.add('show');

            setTimeout(startSoftSpreadBackground, 1500);
          }, 6000);
        }
      }, 250);
    }

    function startSoftSpreadBackground() {
      function spawnSpreadRoses() {
        softRoses = [];
        const roseCount = window.innerWidth < 600 ? 14 : 22;
        for (let i = 0; i < roseCount; i++) {
          softRoses.push(new SoftSpreadRose());
        }

        setTimeout(() => {
          softRoses.forEach(rose => rose.state = 'fade-out');
        }, 2000);
      }

      spawnSpreadRoses();
      setInterval(spawnSpreadRoses, 4000);
    }

    function animate() {
      confCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      roseCtx.clearRect(0, 0, roseCanvas.width, roseCanvas.height);

      confettiParticles.forEach((p, index) => {
        p.update();
        p.draw();
        if (p.opacity <= 0) confettiParticles.splice(index, 1);
      });

      roses.forEach((rose, index) => {
        rose.update();
        rose.draw();
        if (rose.opacity <= 0 || rose.y > roseCanvas.height + 100) {
          roses.splice(index, 1);
        }
      });

      softRoses.forEach(rose => {
        rose.update();
        rose.draw();
      });

      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
